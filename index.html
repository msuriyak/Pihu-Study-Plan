      <ul>
        <li>Days 1–2: complete rest. Non-negotiable.</li>
        <li>Then a repeating 2-day cycle. Day A: full mock at shift time (3 hrs) + 3 hrs on the weakest area
          exposed. Day B: 3 hrs mock review + 4 hrs Class 11 revision. That yields 6–8 full mocks.</li>
        <li>Content priority: Class 11 (most decayed by the lockdown) → inorganic flashcards → the three weakest
          chapters from the Session 1 analysis.</li>
        <li>Final 3 days: error journal, formula sheets, one half-length paper. No new problems, no new mocks.</li>
      </ul>
    </Acc>

    <Acc title="The testing engine">
      <div className="tw"><table><thead><tr><th></th><th>Test</th><th>Length</th><th>Review</th><th>From</th></tr></thead><tbody>
        <tr><td className="mono"><b>T1</b></td><td>Chapter sprint — 15 JEE questions, 2 min each</td><td>30 min</td><td>30 min</td><td>Week 1</td></tr>
        <tr><td className="mono"><b>T2</b></td><td>Weekly mixed retrieval — 25 questions across everything covered</td><td>50 min</td><td>60 min</td><td>Week 1</td></tr>
        <tr><td className="mono"><b>T3</b></td><td>Part-syllabus JEE mock — covered chapters only</td><td>3 hrs</td><td>3 hrs</td><td>Week 2</td></tr>
        <tr><td className="mono"><b>T4</b></td><td>Full-length JEE mock — exam conditions</td><td>3 hrs</td><td>3 hrs</td><td>Phase 2</td></tr>
        <tr><td className="mono"><b>T5</b></td><td>Board sample paper — longhand, self-marked</td><td>3 hrs</td><td>2 hrs</td><td>Phase 1 wk 6</td></tr>
      </tbody></table></div>
      <p>Total across the plan: roughly <b>37 mock papers and 23 full board papers</b> before the exams that count.
        That volume is what separates a student who knows the syllabus from one who can convert it under a clock.</p>
      <p><b>Full-length mocks deliberately do not start in Phase 1.</b> Testing her on Class 11 chapters not yet
        revised produces a demoralising number and no usable information. Part-syllabus mocks give a clean read.</p>
      <h4>The review protocol — the part most students skip</h4>
      <ol className="steps">
        <li><b>Re-attempt cold.</b> Every wrong, skipped or flagged question, redone untimed, <i>before opening any
          solution</i>. Many will now come out — those were never knowledge failures, and they need a completely
          different fix.</li>
        <li><b>Then solutions</b>, only for what survived step 1.</li>
        <li><b>Tag every error</b> — concept / silly / speed / didn't know / mis-gamble.</li>
        <li><b>Extract to the error journal</b>, one line each.</li>
        <li><b>Record the four numbers.</b></li>
      </ol>
      <p className="hint">Never review on the day for anything over an hour. Overnight consolidation genuinely helps,
        and reviewing while demoralised teaches nothing.</p>
      <h4>The four numbers</h4>
      <ul>
        <li><b>Accuracy %</b> — correct ÷ attempted. Should sit at 85%+ under negative marking. Below 75% means
          over-attempting, not under-knowing.</li>
        <li><b>Attempt %</b> — the dial that trades against accuracy.</li>
        <li><b>Time per correct answer</b> — the best single measure of exam efficiency.</li>
        <li><b>Leakage</b> — marks lost to silly, speed and mis-gamble tags: everything known but not scored.
          Typically 20–40 marks. The cheapest score improvement anywhere in this plan, and invisible unless measured.</li>
      </ul>
      <h4>JEE attempt strategy — drill from Phase 2</h4>
      <ol className="steps">
        <li><b>Chemistry first, always.</b> Fastest section, mostly recall, banks certain marks and settles nerves.
          Target 30–35 min. Then Maths — her strength, so a strong second section builds momentum. Physics last.</li>
        <li><b>Pass 1 — the 15-second rule.</b> Attempt only what you can see a path to within fifteen seconds.
          Everything else flagged and abandoned instantly. No exceptions, no "just one more minute".</li>
        <li><b>Pass 2.</b> Return to flagged, up to 3 min each, then abandon again.</li>
        <li><b>Pass 3 — the gambling calculus.</b> On a four-option MCQ at +4/−1, a blind guess is worth +0.25;
          eliminate one option and it rises to about +0.67. <b>Never leave an MCQ blank if one option can be ruled
          out.</b> Section B numericals have carried negative marking since 2025, so blind numerical guesses are
          pure loss — leave those blank.</li>
      </ol>
      <p>For three mocks in Phase 2 the goal is not the score but executing the sweep without deviation. Have her
        note how many times she broke the 15-second rule. That number should fall to zero.</p>
      <div className="note">Re-verify the marking scheme against the official 2027 bulletin in Oct–Nov 2026.
        NTA has changed it twice in recent years.</div>
      <h4>Board attempt strategy — drill in Phase 4</h4>
      <ul>
        <li>Use the 15-minute reading time deliberately: mark what to do first, mentally outline the two 5-markers.</li>
        <li>Answer in the marker's currency — value points, not prose. Underline keywords. Diagram for every
          question that can take one, labelled, even where not asked. A 5-mark derivation without a diagram loses a
          mark almost every time.</li>
        <li>Roughly 1 point per mark, plus a diagram. Over-writing costs time, never marks.</li>
        <li>Never leave blanks — there is no negative marking. A half-remembered definition scores; a blank does not.</li>
      </ul>
    </Acc>

    <Acc title="Subject playbooks">
      <p><b>Maths.</b> The strength — protect it and monetise it. The gap is JEE speed, not understanding. Time every
        chapter sprint at ~2 min/question and record it. Track speed as a number; a logical student responds to a
        moving curve. From Phase 2, add one 25-question mixed set weekly drawing from every chapter covered so far.</p>
      <p><b>Physics.</b> Two deliverables per chapter. <i>Board:</i> a written derivation bank — every derivation in
        the syllabus, written out once longhand with a diagram, collected in one book. About 25 in total, and they
        recur year after year. <i>JEE:</i> volume. The "not very proficient" gap closes with problem count, not more
        theory. Target 60+ JEE questions per heavy chapter.</p>
      <p><b>Chemistry.</b> Physical chapters (Solutions, Electrochemistry, Kinetics) will come easily — treat them as
        numerical practice like physics. Organic is pattern recognition, not memory: one reaction map per chapter
        showing what converts to what, and the "exceptions" mostly dissolve into mechanism. Inorganic is the
        deliberate campaign from decision 3 — 20 minutes daily, reason-scaffolded, never bare lists.</p>
      <p><b>English.</b> An avid reader will have no comprehension problem and may still underperform, because CBSE
        marking rewards value points, not fluency. For each piece: read once for pleasure, extract 6–8 value points,
        write one 120-word answer under time, self-mark against the official scheme. Watch for the beautifully
        written answer that scores 3/5 because it missed two required points. Don't neglect the writing section —
        notice, letter, article, report are formula-driven and quickly learned.</p>
      <p><b>Physical Education.</b> Low effort, high return, best deferred. 45 min/week in the Friday slot through
        Phases 1–2, then a concentrated 12–15 hour block in Phase 4.</p>
    </Acc>

    <Acc title="Risks and open items">
      <ol className="steps steps-flag">
        <li><b>CBSE exam registration — action this first.</b> For the 2026 cycle the Class 12 private candidate form
          opened 9 Sept and closed 30 Sept, late fee to 11 Oct. The 2027 equivalent falls in September 2026. Two
          things to verify: <b>eligibility</b> — CBSE private candidature is generally limited to fail, compartment,
          essential-repeat and improvement candidates, so a first-time homeschooled candidate typically needs either
          enrolment in a CBSE-affiliated school or the NIOS route; and <b>practicals</b> — Physics, Chemistry and PE
          each carry 30 practical marks that must be arranged somewhere. If she is already on a school's rolls this
          is a five-minute check. If not, it needs resolving before anything else in this plan matters.</li>
        <li><b>Class 11 status.</b> The 5 hrs/week reservation is a placeholder until the diagnostic sizes the real
          backlog.</li>
        <li><b>Coaching sequence.</b> If the online course covers chapters in a different order, realign so
          self-study reinforces the lecture rather than running ahead of or behind it.</li>
        <li><b>Test series capacity.</b> This plan consumes ~37 mocks. Check the series actually contains that many,
          whether papers release on a fixed schedule, whether it offers part-syllabus papers for Phase 1, and
          whether it runs on a CBT interface matching NTA's.</li>
        <li><b>Date sheet dependency.</b> Phases 4 and 5 assume a ~17 Feb start. Rebuild both when the real sheet
          arrives in December.</li>
        <li><b>Sustainability.</b> 36 weeks is long. The half-day off, the sleep and the post-exam rest are
          load-bearing parts of the plan. A student who arrives in April fresh will outscore one who arrives
          depleted, regardless of hours logged.</li>
      </ol>
    </Acc>
  </>);
}

/* ═══════════════════  MANUAL  ═══════════════════ */
const BOOKS=[
  ["Mathematics",[["NCERT Class 12, Parts 1 & 2","now"],["NCERT Exemplar Problems","now"],
    ["Oswaal CBSE Question Bank","now"],["Cengage Mathematics (G. Tewani) — one volume at a time","now"],
    ["Arihant 40 Years' JEE Main Chapterwise","now"]]],
  ["Physics",[["NCERT Class 12 — board questions come almost verbatim","now"],["Oswaal CBSE Question Bank","now"],
    ["H. C. Verma, Concepts of Physics Vol. 2","now"],["D. C. Pandey, Understanding Physics — E&M, Optics & Modern","now"],
    ["Arihant 40 Years' JEE Main Chapterwise","now"]]],
  ["Chemistry",[["NCERT Class 12 — read line by line. Highest return per hour on this list","now"],
    ["N. Awasthi, Physical Chemistry — Levels 1 and 2 only","now"],
    ["M. S. Chouhan, Organic Chemistry — earlier exercises only","week 9"],
    ["Oswaal CBSE Question Bank","now"],["J. D. Lee (Indian adaptation) — reference only","phase 2"]]],
  ["Class 11 (JEE track)",[["NCERT Class 11 — all three subjects, especially Chemistry","now"],
    ["H. C. Verma, Concepts of Physics Vol. 1 — mechanics, SHM, waves","now"],
    ["The same chapterwise JEE PYQ book, Class 11 sections","now"]]],
  ["English & PE",[["NCERT Flamingo and Vistas","now"],["Oswaal / Educart English Core Question Bank","now"],
    ["Saraswati, Health and Physical Education Class 12","now"],
    ["CBSE sample papers and marking schemes — cbseacademic.nic.in, free","now"]]],
];
function Manual(){
  return (<>
    <Acc title="Your actual job" open>
      <p>You are not the teacher. The coaching, the online course and the books teach the content. Trying to teach
        it yourself is the one thing that will reliably go wrong: you will be wrong occasionally, she will notice,
        and the trust you need for the rest of this will erode.</p>
      <p><b>Your job is to audit the process, not the physics.</b> That turns out to be the more important job,
        because almost every student who underperforms does so for process reasons — tests not reviewed, revision
        skipped, errors never analysed — and almost none of those require subject knowledge to spot.</p>
      <ul>
        <li><b>Timekeeper.</b> You start and stop the clock. She cannot invigilate herself.</li>
        <li><b>Auditor.</b> You verify the artefacts exist — not that they are correct, that they are there.</li>
        <li><b>Regulator.</b> You protect the rest days and the sleep, and absorb the emotional volatility around
          bad scores so she doesn't have to manage it alone.</li>
      </ul>
      <p>The thing to internalise: you can tell whether someone understands something without understanding it
        yourself. You do this constantly in ordinary life. The teach-back turns it into a method.</p>
    </Acc>

    <Acc title="How to run a test">
      <h4>Before</h4>
      <ul>
        <li>Fix the slot in advance and treat it as immovable. Full JEE mocks start at <b>9:00 AM</b> — the same
          time as her exam shift, so the body learns to peak then.</li>
        <li>Phone in another room. Yours too. Blank rough sheets, pen, water, nothing else on the desk.</li>
        <li>Computer-based mocks: the full three hours in one sitting, no pausing.
          <b> Pausing a mock is the most common way students fool themselves.</b></li>
      </ul>
      <h4>During</h4>
      <p>Timekeeping only. Do not hover, do not enter the room, do not ask how it's going. If she wants to stop
        early, let her — note the time and ask about it the next day, not that day.</p>
      <h4>After</h4>
      <ul>
        <li>No marking on the day for anything over an hour.</li>
        <li><b>She marks, not you</b> — except the Week 0 diagnostic, because a baseline should be independent.
          Self-marking against an official scheme is how she internalises what a marker rewards. Don't take it away.</li>
        <li>Your role is to check the marking happened and record the numbers.</li>
      </ul>
      <h4>The three questions after every test</h4>
      <ol className="steps">
        <li><b>"How many did you get wrong that you knew?"</b> — the leakage number.</li>
        <li><b>"Which one question cost you the most time?"</b> — surfaces the abandon-discipline problem.</li>
        <li><b>"What will you do differently next time?"</b> — if the answer is "study harder", push back. It should
          be specific: <i>Chemistry first</i>, <i>drop anything I can't start in 15 seconds</i>, <i>diagram before
          words</i>.</li>
      </ol>
      <p>If the third answer is vague three tests running, the review protocol isn't being followed. That's a real
        finding, and you found it without knowing any physics.</p>
    </Acc>

    <Acc title="The teach-back — your best instrument">
      <p><b>Once a week, Sunday, five minutes. She explains one chapter to you as if you had never heard of it.</b></p>
      <p>You cannot judge whether her answer to a Gauss's law problem is right. You can absolutely judge whether an
        explanation is fluent and structured or halting and hedged. That judgement is reliable, requires no
        expertise, and correlates strongly with real mastery. Genuine understanding compresses; half-understanding
        rambles.</p>
      <p>Score out of 4 — the four boxes are in the Sunday tab. 3–4 solid · 2 shaky, schedule an extra pass ·
        0–1 she has read it, not learned it.</p>
      <p><b>Two rules.</b> You choose the chapter, from anything covered in the last month, and tell her only at the
        start — a teach-back she prepared for measures preparation, not understanding. And when she stalls, stay
        silent and wait. The stall <i>is</i> the data. Rescuing her destroys the instrument.</p>
    </Acc>

    <Acc title="The weekly task pack">
      <p>Five things every Sunday, all countable or inspectable by anyone. Fifteen minutes total — that's the whole
        audit. Record it in the Sunday tab.</p>
      <div className="tw"><table><thead><tr><th>Deliverable</th><th>What you check</th></tr></thead><tbody>
        {TASKS.map(([k,l,n])=>(<tr key={k}><td><b>{l}</b></td><td>{n}</td></tr>))}
      </tbody></table></div>
      <h4>What the error tags tell you</h4>
      <div className="tw"><table><thead><tr><th>Dominant tag</th><th>Meaning</th><th>Change</th></tr></thead><tbody>
        <tr><td>Silly</td><td>Knowledge fine, execution leaking</td><td>Attempt strategy, slow down on pass 1. Fastest gain available</td></tr>
        <tr><td>Speed</td><td>Knows it, can't do it in time</td><td>More timed sprints, fewer new chapters</td></tr>
        <tr><td>Concept</td><td>Genuine content gaps</td><td>That chapter needs another pass</td></tr>
        <tr><td>Didn't know</td><td>Coverage gap, not skill gap</td><td>Check against the Phase 1 schedule; something was skipped</td></tr>
      </tbody></table></div>
      <p>A shift from <b>concept</b> toward <b>silly</b> over the months is exactly what progress looks like. Point
        it out to her when it happens.</p>
    </Acc>

    <Acc title="How to talk about it">
      <p><b>Never ask "did you study today?"</b> It invites a yes and teaches nothing. Ask about artefacts instead:
        <i> "can I see this week's test log?"</i> Objects are harder to fudge than assurances, and the question
        carries no accusation.</p>
      <p><b>Audit weekly, not daily.</b> Daily monitoring produces resentment and gaming — she'll optimise for
        looking busy rather than learning.</p>
      <p><b>Praise process, never scores.</b> "You reviewed every mock this week" is about something she controls.
        "You got 210" is about the paper's difficulty as much as her. Students praised for scores become frightened
        of hard papers; students praised for process seek them out. Over eight months this compounds enormously.</p>
      <p><b>Never react to one number.</b> Mock scores drop when papers get harder and when the syllabus broadens —
        both are supposed to happen. React only to a three-test trend. Say this out loud now, before the first bad
        score, so it doesn't sound like consolation invented afterwards.</p>
      <p><b>Pre-agree what happens after Session 1 in January: nothing.</b> The score will very likely disappoint —
        it's a rehearsal taken mid-preparation, and only the better of the two attempts counts. Agree the response
        today: three days off, one analysis session, back to the plan. A January score treated as a verdict can cost
        more in February than the paper was ever worth.</p>
      <p><b>Rest is a scheduled item, not a reward for output.</b> Don't let her trade it away on a bad week. She
        will try.</p>
      <p><b>When she's struggling and you can't help with the content</b> — and this will happen — the honest
        response is the good one: <i>"I can't help with the physics, but I can help you work out who can."</i>{" "}
        Offering process help you can actually deliver builds more trust than pretending to competence you don't have.</p>
      <div className="note">Worth saying once, explicitly: she is doing something hard, and doing it without the
        ambient company of thirty other people doing the same thing. That isolation is a real cost and worth naming
        rather than leaving her to assume everyone else finds this easier. If there is any route to a peer group —
        a coaching batch that actually meets, even an online study group — take it. It is worth more than another book.</div>
    </Acc>

    <Acc title="Books">
      <p className="hint">Deliberately short. Every extra book is a daily decision about which one to open, and
        unfinished books breed guilt. One core book per purpose, finished, beats five started. Buy the "now" items
        in Week 0 and nothing else until Phase 2.</p>
      <div className="bgrid">{BOOKS.map(([sub,list])=>(<div key={sub}><h4>{sub}</h4>
        <ul className="blist">{list.map(([b,when])=>(<li key={b}>
          <span className={`when-pill ${when==="now"?"wp-now":""}`}>{when}</span>{b}</li>))}</ul></div>))}</div>
      <div className="note note-red"><b>Do not buy Irodov</b> — aimed well above JEE Main, a time sink for a Mains
        candidate. If someone recommends it, that recommendation is calibrated for a different exam. In Awasthi and
        Chouhan, <b>Levels 1 and 2 only</b>; Level 3 is Advanced material that costs hours and buys almost nothing here.</div>
      <h4>Free and essential</h4>
      <ul>
        <li><b>cbseacademic.nic.in</b> — sample papers, marking schemes, official syllabus. The marking schemes are
          the more valuable document; they show exactly which points earn marks.</li>
        <li><b>NTA Abhyas app</b> — official practice on the real exam interface. Useful specifically because the
          interface matters.</li>
        <li><b>jeemain.nta.nic.in</b> — past papers and answer keys released after each session.</li>
      </ul>
      <p className="hint">The "now" column is roughly ₹8,000–12,000. If budget is tight, the irreducible core is:
        all NCERTs (Class 11 and 12), one Oswaal question bank per subject, and one chapter-wise JEE PYQ book.</p>
    </Acc>

    <Acc title="Red flags">
      <p className="hint">All spottable without knowing any subject. The first three mean something is wrong now.</p>
      <ol className="steps steps-flag">
        <li><b>Unreviewed tests accumulating.</b> Two is a warning, three is a stop-and-fix. The earliest and most
          reliable signal that the plan is slipping.</li>
        <li><b>Recall sheets copied, not written.</b> Printed, photographed or transcribed means the retrieval step
          is being skipped — and retrieval is the entire mechanism by which the second read works.</li>
        <li><b>Error entries untagged, or all tagged the same.</b> The review is being performed rather than done.</li>
        <li><b>Teach-back stuck at 1–2 for three weeks.</b> Content covered, not learned.</li>
        <li><b>Sleep under seven hours regularly.</b> Below that, retention falls faster than the extra hours add.
          An arithmetic point, not a moral one.</li>
        <li><b>She stops complaining.</b> Counterintuitive, but silence and compliance often mean she has given up on
          the plan and is going through the motions. Friction usually signals engagement.</li>
      </ol>
    </Acc>

    <Acc title="Your calendar">
      <div className="tw"><table><thead><tr><th>When</th><th>Task</th></tr></thead><tbody>
        <tr><td><b>This week</b></td><td>Resolve the CBSE exam registration route — September is the hard deadline</td></tr>
        <tr><td><b>This week</b></td><td>Administer the diagnostic. Buy the "now" books. Set up the four artefacts</td></tr>
        <tr><td>Every Sunday</td><td>15-minute task pack audit + 5-minute teach-back + record the numbers</td></tr>
        <tr><td>Every mock</td><td>Timekeeping, then the three questions the next day</td></tr>
        <tr><td>Monthly</td><td>Look at the trend on the four numbers, not the last point</td></tr>
        <tr><td>Sept 2026</td><td>CBSE exam form submitted and confirmed</td></tr>
        <tr><td>Oct–Nov 2026</td><td>JEE registration. Re-verify marking scheme and deleted syllabus against the bulletin</td></tr>
        <tr><td>Dec 2026</td><td>CBSE date sheet — rebuild Phases 4 and 5 around the real gaps</td></tr>
        <tr><td>Late Jan 2027</td><td>Session 1. Then three days off, one analysis session, nothing else</td></tr>
        <tr><td>Feb–Mar 2027</td><td>Board window. Logistics, food, sleep, transport. No academics from you</td></tr>
        <tr><td>Mar–Apr 2027</td><td>Session 2 sprint</td></tr>
      </tbody></table></div>
      <p>Eight months is a long time, and the middle of it — roughly October to December — is where most plans
        quietly die. Not dramatically; they just stop being followed. The single practice that prevents this is the
        Sunday audit, done every week without exception, in the same fifteen minutes, whether or not it seems
        necessary that week. Everything else here is downstream of that habit.</p>
      <p>You've said you're not an educator. For this role that is genuinely not the limitation it feels like. The
        things that decide the outcome — consistency, honest measurement, protected rest, and someone paying steady
        attention — are not subject expertise. They are the things you are already positioned to provide.</p>
    </Acc>
  </>);
}

/* ═══════════════════  BACKUP  ═══════════════════ */
function Backup({db,onExport,onImport,onReset}){
  const ticks=Object.values(db.syllabus).reduce((s,r)=>s+Object.keys(r).filter(k=>k!=="done"&&r[k]).length,0);
  return (<>
    <section className="card"><h2 className="card-h">Backup and transfer</h2>
      <p className="card-sub">This register saves to <b>this browser on this device only</b>. Clearing browsing data
        will erase it, and it does not travel to another phone or laptop by itself. Export a copy every few weeks.</p>
      <ul className="blist" style={{marginBottom:16}}><li><b>{ticks}</b> boxes ticked ·
        <b> {db.tests.length}</b> tests logged · <b>{db.audits.length}</b> weeks audited</li></ul>
      <div className="row-end" style={{marginTop:0,justifyContent:"flex-start",gap:10}}>
        <button className="btn" onClick={onExport}>Export a backup</button>
        <label className="btn btn-ghost" style={{cursor:"pointer"}}>Restore from file
          <input type="file" accept="application/json,.json" onChange={onImport} style={{display:"none"}}/></label>
        <button className="btn btn-ghost" onClick={onReset}>Clear everything</button>
      </div>
      <p className="card-foot">To share between two devices, export from one and restore on the other. Restoring
        replaces whatever is already there, so agree who keeps the master copy — usually whoever runs the Sunday audit.</p>
    </section>
    <section className="card"><h2 className="card-h">Privacy</h2>
      <p className="card-sub">Nothing here leaves your device.</p>
      <p style={{fontSize:12.5,lineHeight:1.65,margin:"0 0 10px"}}>There is no account, no login, no server and no
        analytics. Every tick and every number sits in your own browser's storage. The only network requests this
        page makes are for the React library and the fonts when it first loads, and nothing about your data is sent
        with them. It asks for no name, no email and no identifying detail of any kind — and you should keep it that
        way when you fill it in. Use initials rather than a full name if you note anything personal at all.</p>
      <p style={{fontSize:12.5,lineHeight:1.65,margin:0}}>That also means nobody can recover it for you. The export
        file is your only backup.</p>
    </section>
  </>);
}
